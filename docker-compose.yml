services:
  dog-feed:
    build: .
    # Pas de ports: host — sur Dokploy, Traefik route via le domaine.
    # En local : docker compose run -p 3005:3000 ou ajoute temporairement ports.
    expose:
      - "3000"
    environment:
      PIN: ${PIN:-4242}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-long-random-secret}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      TZ: Europe/Paris
      FEED_MORNING_HOUR: ${FEED_MORNING_HOUR:-9}
      FEED_EVENING_HOUR: ${FEED_EVENING_HOUR:-20}
      MISS_GRACE_HOURS: ${MISS_GRACE_HOURS:-2}
      DATA_DIR: /data
      PORT: 3000
      NODE_ENV: production
      # true derrière HTTPS (Dokploy / Traefik)
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - dog-feed-data:/data
    restart: unless-stopped

volumes:
  dog-feed-data:
